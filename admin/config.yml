backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "website"
    label: "Website"
    files:
      - name: "homepage"
        label: "Homepage"
        file: "content/homepage.yml"
        fields:
          - { label: "Business Name", name: "business_name", widget: "string" }
          - { label: "Headline", name: "headline", widget: "string" }
          - { label: "About Us", name: "about", widget: "text" }
          - { label: "Phone Number", name: "phone", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Hero Image", name: "hero_image", widget: "image" }
          - { label: "About Image", name: "about_image", widget: "image", required: false }
          - { label: "Bottom Image", name: "bottom_image", widget: "image", required: false }
          - label: "Gallery"
            name: "gallery"
            widget: "list"
            required: false
            field: { label: "Image", name: "image", widget: "image" }
